<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Slaymou — Carnet d'entraînement</title>
<meta name="description" content="Le carnet d'entraînement de Slaymou : séances, courses, poids et mesures. Fonctionne hors-ligne, sans compte ni serveur.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Slaymou">
<meta name="theme-color" content="#170f16">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; background: #170f16; }

  :root {
    --bg:#170f16; --surface:#211620; --surface2:#2a1a29; --surface3:#352233; --border:#432c3f;
    --text:#f8eef4; --dim:#bb92ab; --faint:#7c5570;
    --accent:#ff4f93; --accent-ink:#3a0620; --accent-soft:rgba(255,79,147,.14);
    --gold:#ffc971; --gold-soft:rgba(255,201,113,.14);
    --danger:#ff5d5d; --danger-soft:rgba(255,93,93,.14);
    --mono: ui-monospace,"SF Mono","Roboto Mono",Menlo,monospace;
    --sans: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }

  body {
    color: var(--text); background: var(--bg); font-family: var(--sans);
    -webkit-font-smoothing: antialiased; line-height: 1.45;
    max-width: 560px; margin: 0 auto;
    padding-bottom: calc(92px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust: 100%;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  input, textarea { font-family: var(--mono); }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  /* ---- entête ---- */
  header {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 11px;
    padding: calc(16px + env(safe-area-inset-top)) 18px 14px;
    background: rgba(23,15,22,.9); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
  }
  header .mark {
    width: 30px; height: 30px; flex: none; border-radius: 9px;
    background: var(--accent-soft); display: flex; align-items: center; justify-content: center;
  }
  header .mark svg { width: 17px; height: 17px; }
  header .titles { min-width: 0; }
  header h1 { margin: 0; font-size: 16.5px; font-weight: 800; letter-spacing: -.02em; }
  header .meta {
    font-family: var(--mono); font-size: 10px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--dim); margin-top: 3px;
  }
  header .meta b { color: var(--accent); font-weight: 600; }

  /* ---- navigation ---- */
  nav {
    display: flex; gap: 6px; padding: 12px 18px 0;
    overflow-x: auto; scrollbar-width: none;
  }
  nav::-webkit-scrollbar { display: none; }
  nav button {
    flex: 1 0 auto; display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 10px 14px; border-radius: 10px;
    background: var(--surface); color: var(--dim); border: 1px solid transparent;
    font-family: var(--mono); font-size: 10.5px;
    letter-spacing: .08em; text-transform: uppercase;
    transition: .15s; white-space: nowrap;
  }
  nav button svg { width: 14px; height: 14px; flex: none; }
  nav button[aria-current="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; border-color: var(--accent); }
  nav button:focus-visible, main button:focus-visible, .sheet-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  main { padding: 18px; animation: rise .18s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } }

  /* ---- accueil ---- */
  .hero {
    background: linear-gradient(150deg, var(--surface3), var(--surface));
    border: 1px solid var(--border); border-radius: 18px;
    padding: 16px 18px; margin-bottom: 16px;
  }
  .hero-row { display: flex; justify-content: space-between; align-items: baseline; }
  .hero-k { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
  .hero-v { font-family: var(--mono); font-size: 26px; font-weight: 700; color: var(--accent); }
  .hero-note { margin: 9px 0 0; font-size: 12.5px; color: var(--dim); line-height: 1.5; }

  /* ---- petit mot du jour ---- */
  .lovenote {
    background: linear-gradient(150deg, var(--surface3), var(--surface));
    border: 1px solid var(--border); border-left: 3px solid var(--gold);
    border-radius: 0 14px 14px 0; padding: 13px 16px; margin-bottom: 18px;
    font-size: 12.5px; line-height: 1.62; font-style: italic; color: var(--text);
  }
  .lovenote .sign {
    display: flex; align-items: center; gap: 5px; margin-top: 9px; font-style: normal;
    font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--gold);
  }
  .mini-heart { width: 10px; height: 10px; fill: var(--gold); flex: none; }

  /* ---- bande des jours ---- */
  .strip { display: flex; gap: 6px; margin-bottom: 16px; }
  .strip button {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;
    padding: 9px 2px 8px; border-radius: 12px; background: var(--surface);
    border: 1px solid var(--border); color: var(--dim); transition: .15s; min-width: 0;
  }
  .strip button .d { font-family: var(--mono); font-size: 9.5px; letter-spacing: .05em; text-transform: uppercase; }
  .strip button .i { width: 14px; height: 14px; }
  .strip button .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); }
  .strip button[data-daykind="repos"] { opacity: .55; }
  .strip button[data-today="1"] { border-color: var(--accent); color: var(--text); }
  .strip button[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; opacity: 1; }
  .strip button[aria-current="true"] .dot { background: var(--accent-ink); }

  .quickgrid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 18px; }
  .quickcard {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 6px; display: flex; flex-direction: column; align-items: center; gap: 5px;
    min-width: 0; transition: .15s;
  }
  .quickcard:active { border-color: var(--accent); background: var(--surface2); }
  .quickcard svg { width: 18px; height: 18px; color: var(--accent); }
  .qc-label { font-weight: 700; font-size: 13px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .qc-sub { font-family: var(--mono); font-size: 9.5px; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .spark { width: 100%; height: 56px; display: block; }
  .spark polyline { fill: none; stroke: var(--accent); stroke-width: 2; vector-effect: non-scaling-stroke; stroke-linecap: round; stroke-linejoin: round; }
  .spark circle { fill: var(--accent); }
  .spark-foot { display: flex; justify-content: space-between; margin-top: 8px; font-family: var(--mono); font-size: 11px; color: var(--dim); }
  .spark-foot .hi { color: var(--accent); }

  /* ---- exercice ---- */
  .ex { background: var(--surface); border: 1px solid var(--border); border-radius: 15px; margin-bottom: 11px; overflow: hidden; }
  .ex-head { padding: 14px 15px 11px; }
  .ex-name { font-size: 14.5px; font-weight: 650; letter-spacing: -.01em; }
  .ex-sub {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--dim); margin-top: 4px;
  }
  .ex-note { font-size: 11.5px; color: var(--dim); margin-top: 7px; line-height: 1.45; }
  .ex-note.caution { color: #f0cf9a; background: var(--gold-soft); border-radius: 8px; padding: 8px 10px; margin-top: 8px; }
  .ex-goal {
    display: flex; align-items: flex-start; gap: 7px; margin-top: 9px;
    padding: 9px 11px; background: var(--gold-soft); border-radius: 8px;
    font-size: 11.5px; line-height: 1.45; color: #f0cf9a;
  }
  .ex-goal svg { width: 13px; height: 13px; flex: none; margin-top: 2px; fill: var(--gold); }

  .sets { padding: 0 15px 4px; }
  .row { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; }
  .row .n { font-family: var(--mono); font-size: 11px; color: var(--dim); width: 18px; flex: none; }
  .fld { flex: 1; position: relative; }
  .fld input {
    width: 100%; padding: 11px 33px 11px 12px;
    background: var(--surface2); border: 1px solid var(--border); border-radius: 9px;
    color: var(--text); font-size: 16px; font-weight: 600; outline: none; transition: .14s;
  }
  .fld input:focus { border-color: var(--accent); background: var(--surface3); }
  .fld input::placeholder { color: var(--faint); font-weight: 400; }
  .fld u {
    position: absolute; right: 11px; top: 50%; transform: translateY(-50%);
    font-family: var(--mono); font-size: 10px; color: var(--dim);
    text-decoration: none; pointer-events: none;
  }
  .prev {
    font-family: var(--mono); font-size: 10px; color: var(--faint);
    width: 58px; flex: none; text-align: right;
  }
  .add {
    font-family: var(--mono); font-size: 10px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--dim); padding: 3px 0 12px 27px;
  }
  .add:active { color: var(--accent); }

  /* ---- checklist ressenti ---- */
  .check { background: var(--surface); border: 1px solid var(--border); border-radius: 15px; padding: 15px; margin-bottom: 11px; }
  .check h3 { margin: 0 0 10px; font-size: 12px; font-family: var(--mono);
    letter-spacing: .12em; text-transform: uppercase; color: var(--dim); font-weight: 500; }
  .opts { display: flex; gap: 7px; }
  .opts button {
    flex: 1; padding: 11px 4px; border-radius: 9px; background: var(--surface2);
    border: 1px solid var(--border); font-size: 11.5px; color: var(--dim); line-height: 1.3;
  }
  .opts button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 650; border-color: var(--accent); }
  .opts button[aria-pressed="true"][data-v="2"] { background: var(--danger); color: #fff; border-color: var(--danger); }
  .check textarea {
    width: 100%; margin-top: 10px; padding: 11px 12px; resize: vertical; min-height: 46px;
    background: var(--surface2); border: 1px solid var(--border); border-radius: 9px;
    color: var(--text); font-size: 15px; outline: none;
  }
  .check textarea:focus { border-color: var(--accent); }
  .check .warn { margin-top: 10px; font-size: 12px; color: #ff9d9d; line-height: 1.5; }

  /* ---- barre basse (repos / enregistrer) ---- */
  .bar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
    max-width: 560px; margin: 0 auto;
    background: rgba(33,22,32,.96); backdrop-filter: blur(14px);
    border-top: 1px solid var(--border);
    padding: 11px 18px calc(11px + env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: 9px;
  }
  .clock {
    font-family: var(--mono); font-size: 21px; font-weight: 600;
    min-width: 60px; font-variant-numeric: tabular-nums; letter-spacing: -.02em;
  }
  .clock[data-run="1"] { color: var(--accent); }
  .bar .pill { font-family: var(--mono); font-size: 11px; padding: 9px 12px;
    border-radius: 8px; background: var(--surface2); border: 1px solid var(--border); color: var(--dim); }
  .bar .pill:active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .bar .go {
    margin-left: auto; background: var(--accent); color: var(--accent-ink);
    font-size: 12.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
    padding: 11px 16px; border-radius: 9px;
  }
  .bar .go:disabled { opacity: .32; }

  /* ---- cartes génériques ---- */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 15px; padding: 15px; margin-bottom: 11px; }
  .card .date-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .card .date { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--dim); }
  .card .del { flex: none; color: var(--faint); padding: 2px 4px; }
  .card .del:active { color: var(--danger); }
  .card .del svg { width: 15px; height: 15px; }
  .card h3 { margin: 3px 0 0; font-size: 13.5px; font-weight: 650; }
  .card .body { font-family: var(--mono); font-size: 11.5px; color: var(--dim); margin-top: 10px; line-height: 1.75; }
  .card .body strong { color: var(--text); font-weight: 500; }
  .card .said { font-size: 12px; color: var(--dim); margin-top: 9px; font-style: italic; }
  .card .feelflag { font-family: var(--mono); font-size: 10.5px;
    letter-spacing: .1em; text-transform: uppercase; margin-top: 8px; }
  .card .feelflag.warn { color: var(--danger); }
  .card .badge { display: flex; align-items: center; gap: 6px; margin-top: 8px;
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); }
  .card .badge svg { width: 12px; height: 12px; fill: var(--gold); flex: none; }

  .stat { display: flex; justify-content: space-between; align-items: baseline;
    padding: 13px 15px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 9px; }
  .stat .k { font-family: var(--mono); font-size: 10px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--dim); }
  .stat .v { font-family: var(--mono); font-size: 17px; font-weight: 600; }
  .stat .v.hi { color: var(--accent); }
  .stat .v small { font-size: 11px; color: var(--dim); font-weight: 400; margin-left: 5px; }

  .entry { display: flex; gap: 9px; margin-bottom: 9px; }
  .entry input {
    flex: 1; padding: 13px 14px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); font-size: 16px; font-weight: 600; outline: none; min-width: 0;
  }
  .entry input:focus { border-color: var(--accent); }
  .entry button {
    background: var(--accent); color: var(--accent-ink); font-weight: 700;
    font-size: 12.5px; text-transform: uppercase; letter-spacing: .04em;
    padding: 0 18px; border-radius: 10px; flex: none;
  }

  h2.sec {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--dim); font-weight: 500;
    margin: 26px 0 11px;
  }
  h2.sec:first-child { margin-top: 0; }

  .ghostbtn {
    width: 100%; padding: 13px; border-radius: 10px; background: var(--surface);
    border: 1px solid var(--border); color: var(--text);
    font-size: 13px; font-weight: 600; margin-bottom: 9px;
  }
  .ghostbtn:active { border-color: var(--accent); }
  .ghostbtn.danger { color: #ff9d9d; }
  .ghostbtn.danger:active { border-color: var(--danger); }
  .hint { font-size: 11.5px; color: var(--dim); line-height: 1.55; margin: 0 0 18px; }
  .footnote { font-size: 11.5px; color: var(--dim); line-height: 1.6; margin: 22px 0 0; display: flex; gap: 7px; align-items: flex-start; }
  .footnote .mini-heart { margin-top: 3px; }

  .empty { text-align: center; padding: 44px 20px; color: var(--dim); font-size: 12.5px; line-height: 1.65; }
  .empty svg { width: 34px; height: 34px; color: var(--faint); margin-bottom: 12px; }

  .toast {
    position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%);
    background: var(--gold); color: #241400; font-size: 12.5px; font-weight: 700;
    padding: 10px 18px; border-radius: 999px; z-index: 50; white-space: nowrap;
    max-width: calc(100vw - 40px); overflow: hidden; text-overflow: ellipsis;
    animation: pop .22s ease;
  }
  @keyframes pop { from { opacity: 0; transform: translate(-50%,8px); } }

  /* ---- boîtes de confirmation ---- */
  .overlay {
    position: fixed; inset: 0; background: rgba(6,3,6,.66); backdrop-filter: blur(2px);
    display: flex; align-items: center; justify-content: center; z-index: 100; padding: 24px;
    animation: fade .15s ease;
  }
  @keyframes fade { from { opacity: 0; } }
  .sheet { background: var(--surface2); border: 1px solid var(--border); border-radius: 16px;
    padding: 20px; max-width: 340px; width: 100%; animation: rise .18s ease; }
  .sheet h3 { margin: 0 0 8px; font-size: 15px; }
  .sheet p { margin: 0 0 18px; font-size: 13px; color: var(--dim); line-height: 1.5; }
  .sheet-actions { display: flex; gap: 8px; }
  .sheet-btn { flex: 1; padding: 12px; border-radius: 10px; font-size: 13px; font-weight: 650; }
  .sheet-btn.ghost { background: var(--surface3); color: var(--text); }
  .sheet-btn.primary { background: var(--accent); color: var(--accent-ink); }
  .sheet-btn.danger { background: var(--danger); color: #fff; }
</style>
</head>
<body>

<header>
  <div class="mark"><svg viewBox="0 0 20 20" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="4" height="4" rx="1"/><rect x="2.5" y="7" width="2.4" height="6" rx="1"/><rect x="15.1" y="7" width="2.4" height="6" rx="1"/></svg></div>
  <div class="titles">
    <h1 id="greet">Bonjour</h1>
    <div class="meta">Semaine <b id="wk"></b> · <span id="weekcount"></span></div>
  </div>
</header>
<nav id="nav"></nav>
<main id="view"></main>

<script>
/* ═══════════════════════════════════════════════════════════════
   CONFIG — tout ce que tu peux modifier est dans ce bloc.
   Ajouter un exercice : copie une ligne, change id / n / s / r.
   L'id doit être unique et ne doit jamais changer une fois utilisé,
   sinon l'historique de cet exercice ne suivra plus.
   ═══════════════════════════════════════════════════════════════ */

const PROFILE = {
  name:        "Slaymou",     // le prénom affiché partout dans l'app
  start:       "2026-09-19",  // début du programme
  weeklyGoal:  5,             // séances actives visées par semaine (4 muscu + 1 course)
};

// Un petit mot différent chaque jour. Change-les, ajoutes-en, ce sont les tiens.
const LOVE_NOTES = [
  "Chaque série que tu fais aujourd'hui, c'est un pas de plus vers la meilleure version de toi. Je suis fier de toi.",
  "Tu n'as pas besoin d'être parfaite aujourd'hui. Juste présente. Le reste suit tout seul.",
  "La régularité bat toujours l'intensité. Une séance moyenne faite vaut mieux qu'une séance parfaite ratée.",
  "Je t'aime autant les jours où tu es motivée à 100 % que les jours où tu dois te forcer un peu. Les deux comptent pareil.",
  "Ton corps peut ce que ton esprit croit. Et moi, je crois en toi tout le temps.",
  "Petit rappel doux : bois de l'eau, dors bien, et sois fière du chemin parcouru.",
  "Chaque kilo, chaque répétition, chaque séance s'additionne. Tu es en train de construire quelque chose de solide.",
  "Aujourd'hui, c'est un jour de plus où tu choisis de prendre soin de toi. Ça compte énormément.",
  "Pas de comparaison, pas de pression. Juste toi, un peu meilleure qu'hier.",
  "Je suis à un message de distance si tu as besoin d'encouragements — ou d'un câlin après les squats.",
  "Ce carnet, c'est un peu comme moi : toujours dans ton coin, à te pousser gentiment et à croire en toi.",
  "Une séance de plus, une raison de plus d'être fière de toi.",
  "Le progrès n'est pas toujours visible sur la balance. Il est dans ta force, ton énergie, ta confiance.",
  "Merci de te donner à fond, même les jours difficiles. Je t'admire plus que tu ne le penses.",
];

const PROGRAM = {
  lun: { label:"Haut du corps A · Focus tractions", type:"training", ex: [
    { id:"pu_assist", n:"Traction assistée",                    s:3, r:"5-8",   rpe:"7-8", inverse:true,
      tip:"Quand tu fais 3×8 proprement, réduis légèrement l'assistance.",
      coach:"À faire en premier, à froid. Arrête-toi 1-2 reps avant l'échec — ça fatigue beaucoup." },
    { id:"row_appui", n:"Rowing buste appuyé (banc incliné)",   s:3, r:"8-12",  rpe:"7-8",
      tip:"Vise 12 reps sur toutes les séries, puis ajoute un peu de charge.",
      coach:"Excellent travail du dos, avec beaucoup moins de fatigue lombaire qu'un rowing buste penché classique." },
    { id:"dev_incl",  n:"Développé incliné haltères",           s:3, r:"8-12",  rpe:"7-8",
      tip:"Ajoute des répétitions d'abord, puis du poids.",
      coach:"Garde cette séance modérée : elle arrive juste après ta sortie course de dimanche." },
    { id:"elev_lat",  n:"Élévations latérales",                 s:3, r:"10-15", rpe:"7-8",
      tip:"Ajoute des répétitions avant d'augmenter les haltères.",
      coach:"Mouvement contrôlé, sans élan." },
    { id:"curl_bic",  n:"Curl biceps",                          s:2, r:"8-12",  rpe:"7-8",
      tip:"Progresse par répétitions, puis léger ajout de charge.",
      coach:"3ᵉ série optionnelle si la récupération est bonne." },
    { id:"tri_pouss", n:"Extension triceps à la poulie",        s:2, r:"8-12",  rpe:"7-8",
      tip:"Progresse par répétitions, puis léger ajout de charge.",
      coach:"Garde la séance totale raisonnable après la course de dimanche." },
  ]},
  mar: { label:"Bas du corps A · Chaîne postérieure", type:"training", ex: [
    { id:"rdl",          n:"Soulevé de terre roumain",          s:3, r:"6-10",  rpe:"7-8",

function getTodayKey() { return ["dim","lun","mar","mer","jeu","ven","sam"][new Date().getDay()]; }

function week() {
  const d = Math.floor((Date.now() - new Date(PROFILE.start + "T00:00:00")) / 864e5);
  return Math.max(1, Math.floor(d / 7) + 1);
}
function startOfWeek(d = new Date()) {
  const day = (d.getDay() + 6) % 7; // lundi = 0
  const s = new Date(d);
  s.setHours(0,0,0,0);
  s.setDate(d.getDate() - day);
  return s;
}
function sessionsThisWeek() {
  const start = startOfWeek();
  return state.sessions.filter(s => new Date(s.date) >= start).length;
}
function doneThisWeek(key) {
  const start = startOfWeek();
  return state.sessions.some(s => s.day === key && new Date(s.date) >= start);
}
function weekStreak() {
  let streak = 0;
  let cursor = new Date(startOfWeek().getTime() - 7 * 864e5);
  while (streak < 104) {
    const end = new Date(cursor.getTime() + 7 * 864e5);
    const count = state.sessions.filter(s => { const t = new Date(s.date); return t >= cursor && t < end; }).length;
    if (count >= PROFILE.weeklyGoal) { streak++; cursor = new Date(cursor.getTime() - 7 * 864e5); }
    else break;
  }
  return streak;
}
function lastSets(id) {
  for (let i = state.sessions.length - 1; i >= 0; i--) {
    const s = state.sessions[i].ex && state.sessions[i].ex[id];
    if (s && s.length) return s;
  }
  return null;
}
function bestVol(id) {
  let b = 0;
  state.sessions.forEach(s => (s.ex && s.ex[id] || []).forEach(x => { const v = x.kg * x.reps; if (v > b) b = v; }));
  return b;
}
function exTrend(id) {
  return state.sessions
    .filter(s => s.ex && s.ex[id] && s.ex[id].length)
    .map(s => ({ date: s.date, top: Math.max(...s.ex[id].map(x => x.kg)) }));
}

// Suggère un objectif pour la prochaine séance à partir des séries de la dernière fois.
// Jamais pour les exercices marqués "caution" : là, on garde juste la note de prudence.
function suggestFor(ex) {
  if (ex.caution) return null;
  const prev = lastSets(ex.id);
  if (!prev || !prev.length) return null;
  const range = String(ex.r).match(/(\d+)\D+(\d+)/);
  if (!range) return null;
  const lo = +range[1], hi = +range[2];
  const unit = ex.unit || "reps";
  const topKg = Math.max(...prev.map(s => s.kg));
  const allAtTop = prev.every(s => s.reps >= hi);
  const anyBelowLo = prev.some(s => s.reps < lo);

  if (allAtTop) {
    if (unit === "sec") return `Tu as tenu ${hi}s+ sur toutes les séries la dernière fois — essaie d'aller un peu plus loin, ou complexifie la variante.`;
    if (topKg > 0) {
      const step = topKg >= 20 ? 2.5 : 1;
      const nextKg = ex.inverse ? Math.max(0, topKg - step) : topKg + step;
      const verb = ex.inverse ? "réduis l'assistance à" : "vise";
      return `Tu as fait le haut de la fourchette la dernière fois — ${verb} ${nextKg} kg aujourd'hui.`;
    }
    return `Tu as fait le haut de la fourchette la dernière fois — ajoute une répétition si tu peux.`;
  }
  if (anyBelowLo) {
    const kgTxt = topKg > 0 ? ` à ${topKg} kg` : "";
    return `Objectif aujourd'hui : atteins ${lo}${unit === "sec" ? "s" : " reps"} sur chaque série${kgTxt}.`;
  }
  return `Objectif aujourd'hui : au moins une répétition de plus que la dernière fois (${prev.map(s => s.reps).join("/")}).`;
}
function avg(arr, days) {
  const cut = Date.now() - days * 864e5;
  const r = arr.filter(x => new Date(x.date) >= cut);
  return r.length ? r.reduce((a, x) => a + x.kg, 0) / r.length : null;
}
function daysAgo(dateStr) { return Math.max(0, Math.floor((Date.now() - new Date(dateStr)) / 864e5)); }
function sparkline(values) {
  const n = values.length;
  const min = Math.min(...values), max = Math.max(...values);
  const range = (max - min) || 1;
  const pts = values.map((v, i) => {
    const x = n > 1 ? (i / (n - 1)) * 100 : 50;
    const y = 38 - ((v - min) / range) * 32;
    return x.toFixed(1) + "," + y.toFixed(1);
  });
  const last = pts[pts.length - 1].split(",");
  return `<svg class="spark" viewBox="0 0 100 40" preserveAspectRatio="none">
    <polyline points="${pts.join(" ")}"></polyline>
    <circle cx="${last[0]}" cy="${last[1]}" r="1.8"></circle>
  </svg>`;
}
function toast(msg) {
  const o = document.querySelector(".toast"); if (o) o.remove();
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

function dirtyTrainingDay(key) {

}

function confirmDialog({ title = "Confirmer", message, confirmLabel = "Confirmer", danger = false }) {
  return new Promise(resolve => {
    const overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.innerHTML = `<div class="sheet" role="alertdialog" aria-modal="true">
      <h3>${esc(title)}</h3>
      <p>${esc(message)}</p>
      <div class="sheet-actions">
        <button class="sheet-btn ghost" data-a="cancel">Annuler</button>
        <button class="sheet-btn ${danger ? "danger" : "primary"}" data-a="ok">${esc(confirmLabel)}</button>
      </div>
    </div>`;
    document.body.appendChild(overlay);
    const close = v => { overlay.remove(); resolve(v); };
    overlay.addEventListener("click", e => {
      if (e.target === overlay) { close(false); return; }
      const b = e.target.closest("button"); if (!b) return;
      close(b.dataset.a === "ok");
    });
  });
}

        <span class="n">${i+1}</span>
        <span class="fld"><input inputmode="decimal" data-ex="${ex.id}" data-i="${i}" data-f="kg"
          value="${d.kg ?? ""}" placeholder="${p ? p.kg : "—"}" aria-label="Charge série ${i+1}"><u>kg</u></span>
        <span class="fld"><input inputmode="numeric" data-ex="${ex.id}" data-i="${i}" data-f="reps"
          value="${d.reps ?? ""}" placeholder="${p ? p.reps : "—"}" aria-label="${unit==='sec' ? 'Secondes' : 'Répétitions'} série ${i+1}"><u>${unit}</u></span>
        <span class="prev">${p ? p.kg + "×" + p.reps : "1<sup>re</sup>"}</span>
      </div>`;
    }
    h += `<section class="ex">
      <div class="ex-head">
        <div class="ex-name">${esc(ex.n)}</div>
        <div class="ex-sub">${ex.s} × ${ex.r}${ex.rpe ? " · RPE " + esc(ex.rpe) : ""}</div>
        ${goal ? `<div class="ex-goal">${ICONS.star}<span>${esc(goal)}</span></div>` : ""}
        ${ex.tip ? `<div class="ex-note">${esc(ex.tip)}</div>` : ""}
        ${ex.coach ? `<div class="ex-note${ex.caution ? " caution" : ""}"${ex.caution ? "" : ' style="color:var(--faint)"'}>${esc(ex.coach)}</div>` : ""}
      </div>
      <div class="sets">${rows}</div>
      <button class="add" data-add="${ex.id}">+ série</button>
    </section>`;
  });

  const m = meta(key);
  h += `<div class="check">
    <h3>Comment tu te sens ?</h3>
    <div class="opts">${FEEL.map((l,i) =>
      `<button data-feel="${i}" aria-pressed="${m.feel===i}" data-v="${i}">${l}</button>`).join("")}</div>
    ${m.feel===2 ? `<p class="warn">Note-le ici, et ralentis un peu la prochaine séance. Si ça persiste, on en parle à un pro ensemble — je préfère te savoir bien plutôt que de te voir pousser à travers la douleur.</p>` : ""}
    <textarea id="note" placeholder="Note libre : énergie, sommeil, sensations…">${esc(m.note||"")}</textarea>
  </div>`;

  h += bar(key);
  return h;
}

function bar(key, withTimer = true) {
  if (!withTimer) {
    return `<div class="bar">
      <button class="go" data-save="${key}" style="margin-left:0;width:100%" ${isDirty(key)?"":"disabled"}>Enregistrer</button>
    </div>`;
  }
  const m = String(Math.floor(timer.left/60)).padStart(2,"0");
  const s = String(timer.left%60).padStart(2,"0");
  return `<div class="bar">
    <span class="clock" data-run="${timer.on?1:0}">${m}:${s}</span>
    <button class="pill" data-rest="90">90 s</button>
    <button class="pill" data-rest="180">3 min</button>
    <button class="go" data-save="${key}" ${isDirty(key)?"":"disabled"}>Enregistrer</button>
  </div>`;
}

function viewJournal() {
  if (!state.sessions.length)
    return `<div class="empty">${ICONS.journal}<br>Aucune séance enregistrée.<br>Note tes charges dans l'onglet Séance, puis appuie sur Enregistrer.</div>`;

  return [...state.sessions].reverse().map(s => {
    const del = `<button class="del" data-del="${s.date}" aria-label="Supprimer cette entrée">${ICONS.trash}</button>`;

    if (s.kind === "course") {
      return `<article class="card">
        <div class="date-row">
          <div class="date">${fmtD(s.date)} · Course</div>
          ${del}
        </div>
        <h3>${s.distance != null ? s.distance + " km" : "Sortie"}${s.duration != null ? " · " + s.duration + " min" : ""}</h3>
        <div class="body">Ressenti : <strong>${esc(RUN_FEEL[s.feeling||0])}</strong></div>
        ${s.note ? `<div class="said">${esc(s.note)}</div>` : ""}
        ${MILESTONES.includes(s.ordinal) ? `<div class="badge">${ICONS.star}${esc(milestoneLabel(s.ordinal))}</div>` : ""}
      </article>`;
    }

    const vol = Object.values(s.ex || {}).flat().reduce((a,x) => a + x.kg * x.reps, 0);
    const lines = Object.entries(s.ex || {}).map(([id, sets]) => {
      const e = exById(id);
      return `<div><strong>${esc(e ? e.n : id)}</strong><br>${sets.map(x => x.kg + "×" + x.reps).join("  ")}</div>`;
    }).join("");
    return `<article class="card">
      <div class="date-row">
        <div class="date">${fmtD(s.date)} · ${esc(s.label || (PROGRAM[s.day] ? PROGRAM[s.day].label : s.day))}</div>
        ${del}
      </div>
      <h3>Volume ${Math.round(vol).toLocaleString("fr-FR")} kg</h3>
      <div class="body">${lines}</div>
      ${s.note ? `<div class="said">${esc(s.note)}</div>` : ""}
      ${s.feel ? `<div class="feelflag${s.feel===2?" warn":""}">Ressenti · ${esc(FEEL[s.feel])}</div>` : ""}
      ${s.pr ? `<div class="badge">${ICONS.star}${s.pr} record${s.pr>1?"s":""} personnel${s.pr>1?"s":""}</div>` : ""}
      ${MILESTONES.includes(s.ordinal) ? `<div class="badge">${ICONS.star}${esc(milestoneLabel(s.ordinal))}</div>` : ""}
    </article>`;
  }).join("");
}

function viewSuivi() {
  let h = `<h2 class="sec">Poids à jeun</h2>
    <div class="entry">
      <input id="wIn" inputmode="decimal" placeholder="kg" aria-label="Poids à jeun">
      <button data-addw>Noter</button>
    </div>`;

  const w = state.weights;
  if (w.length) {
    if (w.length >= 2) {
      const recent = w.slice(-20);
      h += `<div class="card">${sparkline(recent.map(x => x.kg))}
        <div class="spark-foot"><span>${recent[0].kg.toFixed(1)} kg</span><span class="hi">${recent[recent.length-1].kg.toFixed(1)} kg</span></div>
      </div>`;
    }
    const cur = w[w.length-1].kg, a7 = avg(w,7), a28 = avg(w,28);
    h += `<div class="stat"><span class="k">Dernier</span><span class="v">${cur.toFixed(1)} kg</span></div>`;
    if (a7)  h += `<div class="stat"><span class="k">Moyenne 7 j</span><span class="v hi">${a7.toFixed(1)} kg</span></div>`;
    if (a28 && a7) {
      const d = a7 - a28;
      h += `<div class="stat"><span class="k">Tendance</span><span class="v">${d>=0?"+":""}${d.toFixed(2)} kg<small>vs 28 j</small></span></div>`;
    }
  } else {
    h += `<p class="hint">Chaque matin, à jeun, après être passée aux toilettes, avant de boire. C'est la moyenne sur 7 jours qu'on lit, jamais le chiffre du jour tout seul.</p>`;
  }

  h += `<h2 class="sec">Mesures — le dimanche</h2>`;
  h += `<div class="entry" style="flex-wrap:wrap">` +
    MEASURES.map(m => `<input inputmode="decimal" data-m="${m.id}" placeholder="${m.n}" aria-label="${m.n} en cm" style="flex:1 1 44%">`).join("") +
    `<button data-addm style="flex:1 1 100%;padding:13px 0">Enregistrer les mesures</button></div>`;

  const ms = state.measures;
  if (ms.length) {
    const last = ms[ms.length-1], first = ms[0];
    h += MEASURES.map(m => {
      if (last[m.id] == null) return "";
      const d = first[m.id] != null && ms.length > 1 ? last[m.id] - first[m.id] : null;
      return `<div class="stat"><span class="k">${m.n}</span><span class="v">${last[m.id]} cm${
        d !== null ? `<small>${d>=0?"+":""}${d.toFixed(1)}</small>` : ""}</span></div>`;
    }).join("");
  } else {
    h += `<p class="hint">Mêmes conditions chaque dimanche : même moment de la journée, tenue légère. Ce sont les tendances sur plusieurs semaines qui comptent, jamais une mesure isolée.</p>`;
  }

  h += `<h2 class="sec">Progression force</h2>`;
  let any = false;
  const shown = new Set();
  const trendCard = (ex) => {
    const t = exTrend(ex.id);
    if (t.length < 2) return "";
    shown.add(ex.id);
    any = true;
    return `<div class="card"><h3 style="margin-top:0">${esc(ex.n)}</h3>${sparkline(t.map(x => x.top))}
      <div class="spark-foot"><span>${t[0].top} kg</span><span class="hi">${t[t.length-1].top} kg</span></div>
      ${ex.inverse ? `<p class="hint" style="margin:9px 0 0">Ici, moins = mieux : c'est le poids d'assistance, pas la charge soulevée.</p>` : ""}
    </div>`;
  };

  FLAGSHIP.forEach(f => { h += trendCard(exById(f.id) || f); });

  const others = allEx().filter(ex => !shown.has(ex.id) && !FLAGSHIP.some(f => f.id === ex.id) && exTrend(ex.id).length >= 2);
  if (others.length) {
    h += `<h2 class="sec" style="margin:18px 0 9px">Autres mouvements</h2>`;
    others.forEach(ex => { h += trendCard(ex); });
  }

  if (!any) h += `<p class="hint">Continue à logger tes séries — la courbe de progression de chaque mouvement apparaîtra ici après quelques séances.</p>`;

  return h;
}

function viewData() {
  const n = state.sessions.length, w = state.weights.length, m = state.measures.length;
  return `<h2 class="sec">Sauvegarde</h2>
    <p class="hint">Tes données vivent dans le navigateur de ton téléphone. Vider les données du navigateur les effacerait. Exporte une fois par mois — le fichier se range dans Fichiers ou le cloud, et se réimporte ici en cas de pépin ou sur un autre appareil.</p>
    <button class="ghostbtn" data-export>Exporter — ${n} séance${n>1?"s":""}, ${w} pesée${w>1?"s":""}, ${m} mesure${m>1?"s":""}</button>
    <button class="ghostbtn" data-import>Importer un fichier</button>
    <input type="file" id="fileIn" accept="application/json,.json" hidden>
    <h2 class="sec">Programme en cours</h2>
    <div class="stat"><span class="k">Début</span><span class="v">${fmtD(PROFILE.start)}</span></div>
    <div class="stat"><span class="k">Semaine</span><span class="v hi">${week()}</span></div>
    <div class="stat"><span class="k">Séances totales</span><span class="v">${n}</span></div>
    <h2 class="sec">Zone sensible</h2>
    <button class="ghostbtn danger" data-clearall>Effacer toutes les données</button>
    <p class="footnote">${ICONS.heart.replace("<svg ", '<svg class="mini-heart" ')}<span>Codé avec amour par Hedi, pour toi. Pour changer le programme, ouvre <code>index.html</code> et édite le bloc CONFIG tout en haut — rien d'autre à toucher.</span></p>`;
}

function render() {
  $("#greet").textContent = greetWord() + ", " + PROFILE.name;
  $("#wk").textContent = week();
  $("#weekcount").textContent = sessionsThisWeek() + "/" + PROFILE.weeklyGoal + " séances";
  nav();
  $("#view").innerHTML =
    tab === "home"    ? viewHome()    :
    tab === "seance"  ? viewSeance()  :
    tab === "journal" ? viewJournal() :
    tab === "suivi"   ? viewSuivi()   :
    tab === "data"    ? viewData()    : viewHome();
}

/* ---- interactions ---- */
document.addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;

  if (b.dataset.tab)  { tab = b.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (b.dataset.day)  { dayTab = b.dataset.day; tab = "seance"; render(); window.scrollTo(0,0); return; }
  if (b.dataset.rest) { startTimer(+b.dataset.rest); return; }
  if (b.dataset.feel !== undefined) { meta(dayTab).feel = +b.dataset.feel; render(); return; }
  if (b.dataset.feeling !== undefined) { meta(dayTab).feeling = +b.dataset.feeling; render(); return; }

  if (b.dataset.add !== undefined) {
    const id = b.dataset.add, ex = exById(id);
    const cur = draft.sets[id] || [];
    const n = cur.length || ex.s;
    draft.sets[id] = Array.from({length:n+1}, (_,i) => cur[i] || {});
    render(); return;
  }

  if (b.dataset.save) { await saveSession(b.dataset.save); return; }

  if ("addw" in b.dataset) {
    const v = num($("#wIn").value);
    if (v === null || v < 30 || v > 200) { toast("Entre un poids valide"); return; }
    state.weights.push({ date: new Date().toISOString(), kg: v });
    await persist(); toast("Poids noté"); render(); return;
  }

  if ("addm" in b.dataset) {
    const rec = { date: new Date().toISOString() };
    let any = false;
    document.querySelectorAll("[data-m]").forEach(i => {
      const v = num(i.value);
      if (v !== null && v > 10 && v < 200) { rec[i.dataset.m] = v; any = true; }
    });
    if (!any) { toast("Aucune mesure saisie"); return; }
    state.measures.push(rec);
    await persist(); toast("Mesures enregistrées"); render(); return;
  }

  if ("export" in b.dataset) {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "slaymou-" + new Date().toISOString().slice(0,10) + ".json";
    a.click(); URL.revokeObjectURL(a.href);
    toast("Fichier exporté"); return;
  }

  if ("import" in b.dataset) { $("#fileIn").click(); return; }

  if (b.dataset.del) {
    const dateStr = b.dataset.del;
    const ok = await confirmDialog({
      title: "Supprimer cette entrée ?",
      message: `L'entrée du ${fmtD(dateStr)} sera définitivement supprimée.`,
      confirmLabel: "Supprimer",
      danger: true
    });
    if (!ok) return;
    state.sessions = state.sessions.filter(s => s.date !== dateStr);
    await persist(); toast("Entrée supprimée"); render(); return;
  }

  if ("clearall" in b.dataset) {
    const ok = await confirmDialog({
      title: "Effacer toutes les données ?",
      message: "Séances, poids et mesures seront définitivement supprimés de cet appareil. Exporte une sauvegarde d'abord si tu n'es pas sûre.",
      confirmLabel: "Tout effacer",
      danger: true
    });
    if (!ok) return;
    state = { sessions: [], weights: [], measures: [] };
    await persist(); toast("Données effacées"); render(); return;
  }
});

document.addEventListener("change", async e => {
  if (e.target.id !== "fileIn" || !e.target.files.length) return;
  try {
    const d = JSON.parse(await e.target.files[0].text());
    if (!d.sessions) throw 0;
    const hasData = state.sessions.length || state.weights.length || state.measures.length;
    if (hasData) {
      const ok = await confirmDialog({
        title: "Remplacer les données actuelles ?",
        message: `L'import écrasera tes ${state.sessions.length} séance${state.sessions.length>1?"s":""} actuelles avec le contenu du fichier.`,
        confirmLabel: "Importer",
        danger: true
      });
      if (!ok) { e.target.value = ""; return; }
    }
    state = { sessions: d.sessions||[], weights: d.weights||[], measures: d.measures||[] };
    await persist(); toast("Données importées"); render();
  } catch (err) { toast("Fichier illisible"); }
  e.target.value = "";
});

document.addEventListener("input", e => {
  if (e.target.id === "note")  { meta(dayTab).note = e.target.value; return; }
  if (e.target.id === "rdist") { meta(dayTab).distance = e.target.value; const g=document.querySelector("[data-save]"); if (g) g.disabled=false; return; }
  if (e.target.id === "rdur")  { meta(dayTab).duration = e.target.value; const g=document.querySelector("[data-save]"); if (g) g.disabled=false; return; }
  const i = e.target.closest("input[data-ex]"); if (!i) return;
  const { ex, i: idx, f } = i.dataset;
  draft.sets[ex] = draft.sets[ex] || [];
  draft.sets[ex][idx] = draft.sets[ex][idx] || {};
  draft.sets[ex][idx][f] = i.value;
  const go = document.querySelector("[data-save]"); if (go) go.disabled = false;
});

function startTimer(sec) {
  clearInterval(timer.iv);
  timer.left = sec; timer.on = true;
  const paint = () => {
    const c = document.querySelector(".clock"); if (!c) return;
    c.textContent = String(Math.floor(timer.left/60)).padStart(2,"0") + ":" + String(timer.left%60).padStart(2,"0");
    c.dataset.run = timer.on ? 1 : 0;
  };
  paint();
  timer.iv = setInterval(() => {
    timer.left--;
    if (timer.left <= 0) { clearInterval(timer.iv); timer.on = false; timer.left = 0; toast("Série suivante"); }
    paint();
  }, 1000);
}

const MILESTONES = [1, 10, 25, 50, 75, 100];
function milestoneLabel(n) { return n === 1 ? "Première séance" : n + "ᵉ séance"; }

function milestoneToast(kind, n, pr) {
  if (kind === "course") {
    if (n === 1) return "Première sortie enregistrée. Un pas de plus vers les 10 km.";
    return "Sortie enregistrée. Continue comme ça.";
  }
  if (n === 1) return "Première séance enregistrée. Le début de quelque chose de solide.";
  if (pr) return `Enregistré · ${pr} record${pr>1?"s":""} personnel${pr>1?"s":""} !`;
  if (MILESTONES.includes(n)) return `${n} séances au total. Je suis tellement fier de toi.`;
  return "Séance enregistrée.";
}

async function saveSession(key) {
  const day = PROGRAM[key];
  const m = meta(key);
  const session = {
    date: new Date().toISOString(),
    day: key,
    kind: day.type,
    label: day.label,
    note: (m.note || "").trim(),
    ordinal: state.sessions.length + 1,
  };

  if (day.type === "course") {
    const dist = num(m.distance), dur = num(m.duration);
    if (dist === null && dur === null) { toast("Rien à enregistrer"); return; }
    session.distance = dist;
    session.duration = dur;
    session.feeling = m.feeling || 0;
  } else {
    const ex = {}; let pr = 0;
    day.ex.forEach(e => {
      const raw = draft.sets[e.id] || [];
      const clean = raw.filter(s => s && (s.kg || s.reps)).map(s => ({ kg: num(s.kg) || 0, reps: num(s.reps) || 0 }));
      if (!clean.length) return;
      const best = bestVol(e.id);
      if (best > 0) clean.forEach(s => { if (s.kg * s.reps > best) pr++; });
      ex[e.id] = clean;
    });
    if (!Object.keys(ex).length) { toast("Rien à enregistrer"); return; }
    session.ex = ex;
    session.feel = m.feel || 0;
    session.pr = pr;
    day.ex.forEach(e => { delete draft.sets[e.id]; });
    state.sessions.push(session);
    await persist();
    draft.meta[key] = emptyMeta();
    toast(milestoneToast("training", state.sessions.length, pr));
    render();
    return;
  }

  state.sessions.push(session);
  await persist();
  draft.meta[key] = emptyMeta();
  toast(milestoneToast("course", state.sessions.length, 0));
  render();
}

window.addEventListener("beforeunload", e => { if (anyDirty()) e.preventDefault(); });

load().then(render);
</script>
</body>
</html>
